# Spring
spring.application.name=TradeBot

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.virtual-host=vhost

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Invest API
invest.connector.token=${INVEST_TOKEN:}
invest.connector.sandbox.enabled=${INVEST_CONNECTOR_SANDBOX_ENABLED:true}
invest.connector.sandbox.target-url=sandbox-invest-public-api.tbank.ru:443
invest.connector.app-name=${INVEST_CONNECTOR_APP_NAME:TradeBot}
broker.account.name=${BROKER_ACCOUNT_NAME:}

# Internal API
internal.api.username=${INTERNAL_API_USERNAME:admin}
internal.api.password=${INTERNAL_API_PASSWORD:admin}

# AI signal confirmation. `gemini` remains the default to make provider migration explicit.
ai.enabled=${AI_ENABLED:false}
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
ai.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:5000}
ai.gigachat.api-key=${GIGACHAT_API_KEY:}
ai.gigachat.model=${GIGACHAT_MODEL:GigaChat-2}
ai.gigachat.timeout-ms=${GIGACHAT_TIMEOUT_MS:5000}
ai.gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
ai.min-confidence.buy=${AI_MIN_BUY_CONFIDENCE:0.75}
ai.min-confidence.profit-sell=${AI_MIN_PROFIT_SELL_CONFIDENCE:0.70}
ai.min-confidence.loss-sell=${AI_MIN_LOSS_SELL_CONFIDENCE:0.85}

# Server
server.port=7070
server.address=0.0.0.0
server.shutdown=graceful
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Logging
logging.level.ru.bolotov.tradebot=DEBUG
logging.level.ru.tinkoff.piapi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/trade-bot.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false

trading.loop.delay-ms=7200000
trading.exit.profit.min-strategy-confidence=${PROFIT_EXIT_MIN_STRATEGY_CONFIDENCE:0.80}
trading.exit.loss.min-strategy-confidence=${LOSS_EXIT_MIN_STRATEGY_CONFIDENCE:0.80}
trading.reentry-cooldown-candles=${REENTRY_COOLDOWN_CANDLES:2}
market-regime.confirmation-candles=${MARKET_REGIME_CONFIRMATION_CANDLES:3}
market-regime.strong-trend-ema-spread-percent=${MARKET_REGIME_STRONG_TREND_EMA_SPREAD_PERCENT:0.60}
market-regime.flat-ema-spread-percent=${MARKET_REGIME_FLAT_EMA_SPREAD_PERCENT:0.20}
market-regime.volatile-atr-percent=${MARKET_REGIME_VOLATILE_ATR_PERCENT:0.70}
market-regime.flat-atr-percent=${MARKET_REGIME_FLAT_ATR_PERCENT:0.25}
# Дополнительные параметры определения рыночного режима
market-regime.chop-threshold=${MARKET_REGIME_CHOP_THRESHOLD:61.8}
market-regime.atr-extreme-percent=${MARKET_REGIME_ATR_EXTREME_PERCENT:2.0}
market-regime.atr-high-percent=${MARKET_REGIME_ATR_HIGH_PERCENT:1.0}
market-regime.atr-normal-percent=${MARKET_REGIME_ATR_NORMAL_PERCENT:0.5}
market-regime.atr-low-percent=${MARKET_REGIME_ATR_LOW_PERCENT:0.25}
market-regime.adx-threshold=${MARKET_REGIME_ADX_THRESHOLD:25.0}
broker.protection.reconciliation-delay-ms=${BROKER_PROTECTION_RECONCILIATION_DELAY_MS:180000}
instrument.rescan.interval-ms=${INSTRUMENT_RESCAN_INTERVAL_MS:7200000}
trading.availability.refresh.interval-ms=${TRADING_AVAILABILITY_REFRESH_INTERVAL_MS:60000}
trading.short.min-margin-sufficiency=${SHORT_MIN_MARGIN_SUFFICIENCY:1.25}
trading.quantity.default=100
trading.quantity.sber=150
trading.quantity.t=50
trading.quantity.ydex=75
# Дополнительные параметры стратегий
strategy.supertrend.atr-period=${STRATEGY_SUPERTREND_ATR_PERIOD:10}
strategy.supertrend.multiplier=${STRATEGY_SUPERTREND_MULTIPLIER:3.0}
strategy.vwap.stdev-multiplier=${STRATEGY_VWAP_STDEV_MULTIPLIER:2.0}
strategy.vwap.deviation-threshold=${STRATEGY_VWAP_DEVIATION_THRESHOLD:0.02}
strategy.candlestick.volume-boost-multiplier=${STRATEGY_CANDLESTICK_VOLUME_BOOST_MULTIPLIER:0.15}
strategy.candlestick.max-volume-boost=${STRATEGY_CANDLESTICK_MAX_VOLUME_BOOST:2.0}
