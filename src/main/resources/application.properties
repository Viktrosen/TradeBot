# Spring
spring.application.name=TradeBot

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Invest API
invest.token=${INVEST_TOKEN:}
invest.connector.sandbox.enabled=true
invest.connector.sandbox.target-url=sandbox-invest-public-api.tbank.ru:443
invest.connector.app-name=TestBot
#invest.connector.target-url=invest-public-api.tbank.ru:443

# Internal API
internal.api.username=${INTERNAL_API_USERNAME:admin}
internal.api.password=${INTERNAL_API_PASSWORD:admin}

# Server
server.port=8081
server.shutdown=graceful
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Logging
logging.level.ru.bolotov.tradebot=DEBUG
logging.level.ru.tinkoff.piapi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/trade-bot.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false

trading.loop.delay-ms=60000
trading.quantity.default=100
trading.quantity.sber=150
trading.quantity.t=50
trading.quantity.ydex=75